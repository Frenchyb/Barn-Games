<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Barnyard Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: a sunny farm poster. The race track is the hero, the big GO button sits under it, the animal cards alongside. */
:root{
  color-scheme: light;
  --sky:#bfe7ff; --sky-2:#8fd0ff; --cream:#fff8ea; --line:#e6d6b8;
  --ink:#3d2a16; --muted:#8a704f; --barn:#d7413f; --barn-deep:#a52b2a;
  --sun:#ffcc33; --sun-deep:#d9a21b; --pink:#ff8fb1;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky);background-image:linear-gradient(180deg,#9fd6ff 0%,#cfeeff 45%,#eaf7e3 100%);background-attachment:fixed;color:var(--ink);font:16px/1.5 var(--body);overflow-x:hidden}
.app{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-name{font-family:var(--display);font-size:2rem;color:var(--barn);line-height:1.05;text-shadow:0 2px 0 #fff}
.brand-sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:900}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:.5em 1.05em;font-weight:800;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.armed{border-color:var(--barn);color:var(--barn);background:#fff0ef}
.primary{border-radius:999px;border:none;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:400;letter-spacing:.02em;padding:.55em 1.5em;font-size:1.55rem;box-shadow:0 7px 0 var(--sun-deep),0 12px 24px rgba(60,40,0,.2);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sun-deep),0 4px 10px rgba(60,40,0,.2)}
.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
button:focus-visible,.card:focus-visible{outline:3px solid var(--barn);outline-offset:2px}
h1,h2,p{margin:0}
.race-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:1100px){.race-grid{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;color:var(--muted);font-weight:900}
.headline{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.4vw,2.9rem);line-height:1.1}
.headline .who{color:var(--barn)}
.track-wrap{position:relative;border-radius:22px;overflow:hidden;border:4px solid #fff;background:var(--sky-2);box-shadow:0 18px 40px rgba(50,70,30,.25);min-height:240px}
#gl canvas{display:block}
.gl-fail{margin:0;padding:40px 24px;text-align:center;color:var(--muted);font-weight:800}
.ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ov[hidden]{display:none}
.ov-count{font-family:var(--display);font-size:clamp(5rem,22vw,14rem);color:#fff;-webkit-text-stroke:3px var(--barn);text-shadow:0 8px 0 rgba(165,43,42,.9),0 14px 30px rgba(0,0,0,.25);line-height:1}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.ov-banner{place-items:start center;padding-top:14px}
.ov-banner span{background:#fff;border:4px solid var(--sun);color:var(--barn);font-family:var(--display);font-size:clamp(1.3rem,3.6vw,2.6rem);padding:.2em .9em;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.2);text-align:center;line-height:1.15;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ov-banner small{display:block;font-family:var(--body);font-weight:900;font-size:.5em;color:var(--muted)}
.ov-flash{background:#fff;opacity:0}
.ov-feed{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:72%}
.feed-line{background:rgba(255,255,255,.93);color:var(--ink);border-radius:14px;padding:.35em .9em;font-weight:800;font-size:.95rem;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:rise .4s ease-out}
.feed-line b{color:var(--barn)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.controls{display:flex;flex-direction:column;gap:10px}
.commentary{font-size:1.2rem;font-weight:800;min-height:1.5em}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem;font-weight:800}
.panel{background:var(--cream);border:2px solid #fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 10px 30px rgba(60,70,30,.12)}
.panel h2{font-family:var(--display);font-weight:400;font-size:1.4rem}
.lede{color:var(--muted);font-weight:800;font-size:.9rem}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:16px;border:3px solid var(--line);background:#fff;padding:10px 8px 8px;text-align:center;cursor:pointer;user-select:none;transition:transform .1s}
.card:hover{transform:translateY(-2px)}
.card .face{font-size:2.5rem;line-height:1.1}
.card .nm{font-weight:900;font-size:1rem}
.card .kd{font-size:.74rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.card .rib{font-size:.85rem;min-height:1.3em;letter-spacing:-.12em;line-height:1.3}
.card.out{opacity:.45;filter:grayscale(1)}
.card .heart{position:absolute;top:5px;right:5px;border:none;background:#fff;border-radius:50%;width:30px;height:30px;font-size:1.05rem;line-height:1;opacity:.35;padding:0}
.card .heart:hover,.card.fav .heart{opacity:1}
.card.fav{border-color:var(--pink);box-shadow:0 0 0 3px #ffd5e2}
.card.winner{border-color:var(--sun);box-shadow:0 0 0 4px #ffe9a3}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{color:var(--muted);font-weight:900;font-size:.88rem}
.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.86rem;font-weight:800}
.link:hover{color:var(--ink)}
.msg{font-size:.9rem;color:var(--barn);font-weight:800;min-height:1.3em}
:fullscreen .app{max-width:none;padding:10px 14px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-name">The Barnyard Race</div><div class="brand-sub">Ready, set, moo!</div></div>
    <div class="tools">
      <button type="button" class="btn" id="soundBtn" aria-pressed="true">Sound on</button>
      <button type="button" class="btn" id="fullBtn">Full screen</button>
    </div>
  </header>
  <section aria-label="The race">
    <div class="race-grid">
      <div class="stage">
        <div><p class="eyebrow" id="eyebrow">Ready to race</p><h1 class="headline" id="headline">Who will win the <span class="who">Barnyard Race</span>?</h1></div>
        <div class="track-wrap" id="trackWrap">
          <div id="gl" role="img" aria-label="Barnyard race track"></div>
          <div class="ov" id="countOv" hidden><div class="ov-count" id="countTxt"></div></div>
          <div class="ov ov-banner" id="bannerOv" hidden><span id="bannerTxt"></span></div>
          <div class="ov ov-flash" id="flashOv"></div>
          <div class="ov-feed" id="feedOv" aria-live="polite"></div>
        </div>
        <div class="controls">
          <p class="commentary" id="commentary" aria-live="polite">Everybody is lining up by the barn!</p>
          <div class="actions"><button type="button" class="primary" id="goBtn">Start the race!</button><span class="hint">or press the space bar</span></div>
        </div>
      </div>
      <aside class="panel" aria-label="Racers">
        <div class="row-between"><h2>Who's racing?</h2><span class="count" id="countLabel"></span></div>
        <p class="lede">Tap an animal to put it in or out of the race. Tap the heart to cheer for a favorite.</p>
        <ul class="cards" id="cards"></ul>
        <p class="msg" id="msg"></p>
        <div class="row-between"><span class="count">🏅 = a race won</span><button type="button" class="link" id="clearWins">Clear ribbons</button></div>
      </aside>
    </div>
  </section>
</div>

<script>
// If the 3D engine can't download, the module below never runs; show the same message boot() would.
setTimeout(() => { if (!window.__barnyardBooted) { const h = document.getElementById('gl'); if (h) h.innerHTML = '<p class="gl-fail">The 3D farm could not load. Check the connection and reload.</p>'; } }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
window.__barnyardBooted = true;
// Keep the original r128 colour handling so the hand-built farm looks the same; revisit when real models land.
THREE.ColorManagement.enabled = false;
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ANIMALS = [

  { id: 'cow', name: 'Daisy', kind: 'Cow', emoji: '🐮', say: 'Moo!', hex: '#8b5e3c' },
  { id: 'sheep', name: 'Woolly', kind: 'Sheep', emoji: '🐑', say: 'Baa!', hex: '#5b8fd6' },
  { id: 'chicken', name: 'Henrietta', kind: 'Chicken', emoji: '🐔', say: 'Bawk bawk!', hex: '#e8702a' },
  { id: 'horse', name: 'Buttercup', kind: 'Horse', emoji: '🐴', say: 'Neigh!', hex: '#b8860b' },
  { id: 'goat', name: 'Billy', kind: 'Goat', emoji: '🐐', say: 'Meh-eh-eh!', hex: '#6c7a7d' },
  { id: 'duck', name: 'Puddles', kind: 'Duck', emoji: '🦆', say: 'Quack quack!', hex: '#2a9d8f' },
  { id: 'frog', name: 'Hoppy', kind: 'Frog', emoji: '🐸', say: 'Ribbit ribbit!', hex: '#3fa34d' },
];
const byId = Object.fromEntries(ANIMALS.map(a => [a.id, a]));
const KEY = 'barnyard-race-v1';
const S = Object.assign({ sound: true, out: [], fav: null, wins: {}, races: 0 }, load());
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Audio: recorded animal calls where we have them (sounds/, all CC0), everything else synthesised ---------- */
let AC = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;

const now = () => AC.currentTime;
function osc(o) {

  fl.type = o.ft || 'bandpass'; fl.frequency.value = o.f || 1000; fl.Q.value = o.q || 1;
  g.gain.setValueAtTime(0.0001, o.t); g.gain.exponentialRampToValueAtTime(o.v, o.t + a); g.gain.exponentialRampToValueAtTime(0.0001, o.t + o.d);
  s.connect(fl).connect(g).connect(o.out || sfxBus); s.start(o.t, Math.random() * 1.5); s.stop(o.t + o.d + 0.05);
}
/* animal voices: synthesised fallbacks, used until (or unless) a recording loads */
const SYNTH = {
  pig(t, k = 1) { for (const o of [0, .17]) { osc({ f: 230, to: 110, t: t + o, d: .12 * k + .05, v: .2, type: 'sawtooth', lp: 900, a: .01 }); noise({ t: t + o, d: .1, v: .1, f: 600, q: 2 }); } },
  cow(t, k = 1) { const d = .9 * k; osc({ f: 196, to: 147, t, d, v: .17, type: 'sawtooth', lp: 650, a: .1, hold: 1, vib: { f: 5, depth: 4 } }); osc({ f: 98, to: 73, t, d, v: .09, type: 'square', lp: 350, a: .1, hold: 1 }); },
  sheep(t, k = 1) { const d = .75 * k; osc({ f: 440, to: 392, t, d, v: .1, type: 'sawtooth', lp: 1500, a: .03, hold: 1, vib: { f: 10, depth: 28 } }); osc({ f: 220, to: 196, t, d, v: .05, type: 'square', lp: 800, a: .03, hold: 1, vib: { f: 10, depth: 14 } }); },
  goat(t, k = 1) { const d = .55 * k; osc({ f: 560, to: 500, t, d, v: .1, type: 'sawtooth', lp: 2400, a: .02, hold: 1, vib: { f: 15, depth: 50 } }); osc({ f: 280, to: 250, t, d, v: .04, type: 'square', lp: 1200, a: .02, hold: 1, vib: { f: 15, depth: 25 } }); },
  chicken(t, k = 1) { [0, .12, .24, .42].forEach((o, i) => { const last = i === 3; osc({ f: last ? 1000 : 850, to: last ? 500 : 600, t: t + o, d: last ? .2 : .07, v: .09, type: 'square', lp: 2200, a: .005 }); noise({ t: t + o, d: .05, v: .08, f: 1800, q: 3 }); }); },

  duck(t, k = 1) { [0, .24].forEach(o => { osc({ f: 520, to: 380, t: t + o, d: .17, v: .1, type: 'square', lp: 1500, a: .01, hold: 1, vib: { f: 30, depth: 20 } }); noise({ t: t + o, d: .15, v: .05, ft: 'lowpass', f: 1200 }); }); },
  horse(t, k = 1) { const d = .7 * k; osc({ f: 1150, to: 480, t, d, v: .09, type: 'sawtooth', lp: 3200, a: .02, hold: 1, vib: { f: 14, depth: 60 } }); osc({ f: 575, to: 240, t, d, v: .04, type: 'square', lp: 1600, a: .02, hold: 1, vib: { f: 14, depth: 30 } }); noise({ t: t + d, d: .15, v: .08, ft: 'lowpass', f: 500 }); },

const SAMPLE_FILES = { pig: 'sounds/pig-oink.mp3', cow: 'sounds/cow-moo.mp3', sheep: 'sounds/sheep-baa.mp3', chicken: 'sounds/chicken-cluck.mp3' };
const SAMPLE_VOL = { pig: 1.1, cow: 0.9, sheep: 0.9, chicken: 0.8 };
const sampleData = {}, samples = {};
// Fetch the files right away; decoding waits for the AudioContext, which needs a tap first.
for (const [id, url] of Object.entries(SAMPLE_FILES)) sampleData[id] = fetch(url).then(r => (r.ok ? r.arrayBuffer() : null)).catch(() => null);

    if (samples[id] !== undefined) continue; samples[id] = null;

function playSample(id, t, k = 1) {
  const b = samples[id], src = AC.createBufferSource(), g = AC.createGain(), d = Math.min(b.duration, b.duration * Math.max(0.45, k) + 0.05), v = SAMPLE_VOL[id] || 1;

  rooster(t) { let tt = t; for (const [f, d] of [[659, .14], [784, .14], [880, .24], [784, .8]]) { osc({ f, to: d > .5 ? f * .72 : f * 1.02, t: tt, d, v: .12, type: 'sawtooth', lp: 2800, a: .02, hold: 1, vib: d > .5 ? { f: 9, depth: 25 } : null }); tt += d; } },
  bell(t) { osc({ f: 880, t, d: .35, v: .12, type: 'square', lp: 3000, a: .002 }); osc({ f: 1319, t, d: .25, v: .05, type: 'square', a: .002 }); noise({ t, d: .03, v: .1, f: 4000 }); },
  go(t) { [523, 659, 784, 1047].forEach((f, i) => osc({ f, t: t + i * .08, d: i === 3 ? .6 : .14, v: .1, type: 'sawtooth', lp: 2500, a: .01, hold: 1 })); },
  splat(t) { noise({ t, d: .18, v: .25, ft: 'lowpass', f: 600 }); osc({ f: 180, to: 60, t, d: .2, v: .15 }); },
  splash(t) { noise({ t, d: .3, v: .2, f: 2500, q: .6 }); noise({ t: t + .05, d: .25, v: .12, f: 1200, q: .8 }); },
  munch(t) { for (let k = 0; k < 3; k++) noise({ t: t + k * .14, d: .06, v: .14, f: 900, q: 3 }); },
  thud(t) { noise({ t, d: .12, v: .2, ft: 'lowpass', f: 300 }); osc({ f: 120, to: 50, t, d: .15, v: .2 }); },
  boing(t) { osc({ f: 300, to: 900, t, d: .25, v: .12, type: 'triangle' }); },
  whoosh(t) { noise({ t, d: .35, v: .15, f: 1500, q: .5 }); },
  crunch(t) { noise({ t, d: .08, v: .2, f: 2200 }); noise({ t: t + .1, d: .06, v: .12, f: 1600, q: 2 }); },
  flutter(t) { for (let k = 0; k < 6; k++) noise({ t: t + k * .07, d: .04, v: .05, f: 3000, q: 2 }); },
  cheer(t) { noise({ t, d: 2.6, v: .12, f: 900, q: .4, a: .3 }); noise({ t: t + .2, d: 2.2, v: .08, f: 2200, q: .6, a: .4 }); },
  pop(t) { noise({ t, d: .08, v: .2, ft: 'highpass', f: 2000 }); osc({ f: 600, to: 200, t, d: .1, v: .1 }); },

    li.addEventListener('click', () => toggleOut(a.id)); li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOut(a.id); } });
    li.querySelector('.heart').addEventListener('click', e => { e.stopPropagation(); S.fav = S.fav === a.id ? null : a.id; save(); runners.forEach(r => (r.obj.heart.visible = S.fav === r.id)); renderCards(winnerId); if (S.fav) setMsg(`Go, ${a.name}, go!`); });
    ul.appendChild(li);
  });
  $('countLabel').textContent = `${ANIMALS.length - S.out.length} racing`;
}
function setMsg(t) { $('msg').textContent = t; clearTimeout(setMsg.t); setMsg.t = setTimeout(() => ($('msg').textContent = ''), 3000); }
function toggleOut(id) {
  if (mode !== 'ready' && mode !== 'done') { setMsg('Wait for the race to finish!'); return; }
  const out = S.out.includes(id);
  if (!out && ANIMALS.length - S.out.length <= 2) { setMsg('We need at least two racers!'); return; }
  S.out = out ? S.out.filter(x => x !== id) : S.out.concat(id); save(); reset();
}

/* ---- buttons ---- */
goBtn.addEventListener('click', go);
document.addEventListener('keydown', e => { if (e.code === 'Space' && !/^(INPUT|BUTTON|LI)$/.test(document.activeElement.tagName)) { e.preventDefault(); go(); } });
$('clearWins').addEventListener('click', () => { S.wins = {}; save(); renderCards(); setMsg('Ribbons cleared.'); });
$('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); $('soundBtn').textContent = S.sound ? 'Sound on' : 'Sound off'; $('soundBtn').setAttribute('aria-pressed', S.sound); $('soundBtn').classList.toggle('armed', !S.sound); if (audio()) { master.gain.setTargetAtTime(S.sound ? 0.8 : 0, now(), 0.05); if (S.sound && !seq) idleMusic(); } });
$('fullBtn').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); });
document.addEventListener('fullscreenchange', () => { $('fullBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; W = 0; });
document.addEventListener('pointerdown', () => { if (audio() && !seq) idleMusic(); }, { once: true });
if (!S.sound) { $('soundBtn').textContent = 'Sound off'; $('soundBtn').classList.add('armed'); $('soundBtn').setAttribute('aria-pressed', 'false'); }

/* ---- boot ---- */
function layout() {
  W = trackWrap.clientWidth || 800; H = clamp(Math.round(W * 9 / 16), 240, Math.max(260, Math.round(window.innerHeight * (document.fullscreenElement ? 0.78 : 0.72))));
  renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix();
}
let last = performance.now();
function frame(t) { requestAnimationFrame(frame); const dt = Math.min(0.05, (t - last) / 1000); last = t; if (!W) layout(); update(dt); renderer.render(scene, camera); }
function boot() {
  let ok = THREE_OK;
  if (ok) {
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.useLegacyLights = true; glHost.appendChild(renderer.domElement);
    } catch (e) { ok = false; }
  }

  scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd9ff); scene.fog = new THREE.Fog(0xbfe7ff, 90, 230);
  camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 500);
  scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x6a9a4a, 0.75));
  sun = new THREE.DirectionalLight(0xfff4dc, 1.0); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = sun.shadow.camera.bottom = -36; sun.shadow.camera.right = sun.shadow.camera.top = 36; sun.shadow.camera.near = 1; sun.shadow.camera.far = 160; sun.shadow.bias = -0.0005; scene.add(sun); scene.add(sun.target);
  buildTextures(); buildWorld(); makeConfetti();
  window.addEventListener('resize', () => { W = 0; });
  reset(); requestAnimationFrame(frame);
  loadModels().then(() => { if (mode === 'ready') reset(); });
}
boot();
</script>
