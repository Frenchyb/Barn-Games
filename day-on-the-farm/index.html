<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day on the Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --sky:#bfe7ff; --sky-2:#8fd0ff; --cream:#fff8ea; --line:#e6d6b8;
  --ink:#3d2a16; --muted:#8a704f; --barn:#d7413f; --barn-deep:#a52b2a;
  --sun:#ffcc33; --sun-deep:#d9a21b; --pink:#ff8fb1;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky);background-image:linear-gradient(180deg,#9fd6ff 0%,#cfeeff 45%,#eaf7e3 100%);background-attachment:fixed;color:var(--ink);font:16px/1.5 var(--body);overflow-x:hidden}
.app{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-name{font-family:var(--display);font-size:2rem;color:var(--barn);line-height:1.05;text-shadow:0 2px 0 #fff}
.brand-sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:900}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:.5em 1.05em;font-weight:800;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.armed{border-color:var(--barn);color:var(--barn);background:#fff0ef}
.primary{border-radius:999px;border:none;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:400;letter-spacing:.02em;padding:.55em 1.5em;font-size:1.55rem;box-shadow:0 7px 0 var(--sun-deep),0 12px 24px rgba(60,40,0,.2);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sun-deep),0 4px 10px rgba(60,40,0,.2)}
.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
button:focus-visible,.card:focus-visible{outline:3px solid var(--barn);outline-offset:2px}
h1,h2,p{margin:0}
.race-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:1100px){.race-grid{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;color:var(--muted);font-weight:900}
.headline{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.4vw,2.9rem);line-height:1.1}
.headline .who{color:var(--barn)}
.track-wrap{position:relative;border-radius:22px;overflow:hidden;border:4px solid #fff;background:var(--sky-2);box-shadow:0 18px 40px rgba(50,70,30,.25);min-height:240px}
#gl canvas{display:block}
.gl-fail{margin:0;padding:40px 24px;text-align:center;color:var(--muted);font-weight:800}
.ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ov[hidden]{display:none}
.ov-count{font-family:var(--display);font-size:clamp(5rem,22vw,14rem);color:#fff;-webkit-text-stroke:3px var(--barn);text-shadow:0 8px 0 rgba(165,43,42,.9),0 14px 30px rgba(0,0,0,.25);line-height:1}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.ov-banner{place-items:start center;padding-top:14px}
.ov-banner span{background:#fff;border:4px solid var(--sun);color:var(--barn);font-family:var(--display);font-size:clamp(1.3rem,3.6vw,2.6rem);padding:.2em .9em;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.2);text-align:center;line-height:1.15;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ov-banner small{display:block;font-family:var(--body);font-weight:900;font-size:.5em;color:var(--muted)}
.ov-flash{background:#fff;opacity:0}
.ov-feed{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:72%}
.feed-line{background:rgba(255,255,255,.93);color:var(--ink);border-radius:14px;padding:.35em .9em;font-weight:800;font-size:.95rem;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:rise .4s ease-out}
.feed-line b{color:var(--barn)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.controls{display:flex;flex-direction:column;gap:10px}
.commentary{font-size:1.2rem;font-weight:800;min-height:1.5em}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem;font-weight:800}
.panel{background:var(--cream);border:2px solid #fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 10px 30px rgba(60,70,30,.12)}
.panel h2{font-family:var(--display);font-weight:400;font-size:1.4rem}
.lede{color:var(--muted);font-weight:800;font-size:.9rem}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:16px;border:3px solid var(--line);background:#fff;padding:10px 8px 8px;text-align:center;cursor:pointer;user-select:none;transition:transform .1s}
.card:hover{transform:translateY(-2px)}
.card .face{font-size:2.5rem;line-height:1.1}
.card .nm{font-weight:900;font-size:1rem}
.card .kd{font-size:.74rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.card .rib{font-size:.85rem;min-height:1.3em;letter-spacing:-.12em;line-height:1.3}
.card.out{opacity:.45;filter:grayscale(1)}
.card .heart{position:absolute;top:5px;right:5px;border:none;background:#fff;border-radius:50%;width:30px;height:30px;font-size:1.05rem;line-height:1;opacity:.35;padding:0}
.card .heart:hover,.card.fav .heart{opacity:1}
.card.fav{border-color:var(--pink);box-shadow:0 0 0 3px #ffd5e2}
.card.winner{border-color:var(--sun);box-shadow:0 0 0 4px #ffe9a3}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{color:var(--muted);font-weight:900;font-size:.88rem}
.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.86rem;font-weight:800}
.link:hover{color:var(--ink)}
.msg{font-size:.9rem;color:var(--barn);font-weight:800;min-height:1.3em}
:fullscreen .app{max-width:none;padding:10px 14px}
/* Day on the Farm: the stage is the show; scene chips sit under it. */
.stage-wrap{position:relative}
.caption{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);margin:0;width:max-content;max-width:88%;background:rgba(255,255,255,.94);border-radius:18px;padding:.3em 1em;font-weight:900;font-size:clamp(1.05rem,2.7vw,1.7rem);line-height:1.25;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.15);pointer-events:none}
.caption:empty{display:none}
.caption.pop{animation:rise .4s ease-out}
.ov-fade{background:#fff;opacity:0;transition:opacity .6s ease}
.ov-fade.on{opacity:1}
.ov-start{pointer-events:auto;background:rgba(191,231,255,.5);display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:16px}
.start-hint{font-weight:900;font-size:1.1rem;background:rgba(255,255,255,.9);border-radius:999px;padding:.25em 1em}
.scenes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;border-radius:999px;border:3px solid var(--line);background:#fff;padding:.35em 1.05em .35em .7em;font-weight:900;font-size:1.05rem;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip:disabled{opacity:.5;cursor:wait}
.chip .em{font-size:1.7rem;line-height:1}
.chip.on{border-color:var(--sun);box-shadow:0 0 0 4px #ffe9a3}
.foot{text-align:center;color:var(--muted);font-weight:800;font-size:.9rem}
.ov-drops{position:absolute;inset:0;pointer-events:none;opacity:0}
.ov-drops.show{animation:drops 2.2s ease-out}
.ov-drops span{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(140,200,255,.6) 45%,rgba(90,160,230,.35));box-shadow:0 2px 6px rgba(0,60,120,.25)}
@keyframes drops{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1)}70%{opacity:.9;transform:translateY(18px)}100%{opacity:0;transform:translateY(46px)}}
@media (prefers-reduced-motion: reduce){.ov-drops.show,.caption.pop{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-name">Day on the Farm</div><div class="brand-sub">Help out on the farm</div></div>
    <div class="tools">
      <button type="button" class="btn" id="soundBtn" aria-pressed="true">Sound on</button>
      <button type="button" class="btn" id="voiceBtn" aria-pressed="true">Voice on</button>
      <button type="button" class="btn" id="fullBtn">Full screen</button>
    </div>
  </header>
  <div class="track-wrap stage-wrap" id="stageWrap">
    <div id="gl" role="img" aria-label="The farm"></div>
    <div class="ov ov-banner" id="bannerOv" hidden><span id="bannerTxt"></span></div>
    <div class="ov" id="countOv" hidden><div class="ov-count" id="countTxt"></div></div>
    <div class="ov-drops" id="drops" aria-hidden="true"></div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="ov ov-fade" id="fadeOv"></div>
    <div class="ov ov-start" id="startOv"><button type="button" class="primary" id="startBtn" disabled>Loading the farm…</button><p class="start-hint">Tap the animals with a yellow ring to help on the farm!</p></div>
  </div>
  <nav class="scenes" id="scenes" aria-label="Pick a show"></nav>
  <p class="foot">When an animal has a yellow ring, tap it to make the story go. Tap any animal and it says hello.</p>
</div>

    let best = a && turn.targets.includes(a) ? a : null, bd = Math.max(110, r.width * 0.14);
    if (!best) for (const t of turn.targets) { if (!t.spot && !t.root.visible) continue; const s = onScreen(t); if (!s) continue; const d = Math.hypot(s[0] - x * W / r.width, s[1] - y * H / r.height); if (d < bd) { bd = d; best = t; } }
    if (best) { endTurn(best); return; }
  }
  const p = ray.ray.intersectPlane(groundPlane, V(0, 0, 0));
  if (!a && p) { let best = 2.6; for (const b of shown) { const d = Math.hypot(posOf(b).x - p.x, posOf(b).z - p.z); if (d < best) { best = d; a = b; } } }
  if (a) { if (time - a.lastTap > 0.5) { a.lastTap = time; greet(a, 2); } }
  else if (p) { burst(p.setY(0.3), [0xffd23f, 0xff8fb1, 0x8fd0ff, 0x8fe08a], 12, 2, 5); play('boing'); }
}

/* ---- buttons ---- */
function renderChips() {
  const nav = $('scenes'), mk = (i, em, label) => `<button type="button" class="chip" data-i="${i}" disabled><span class="em">${em}</span>${label}</button>`;
  nav.innerHTML = mk(-1, '☀️', 'The whole day') + SCENES.slice(1).map((s, j) => mk(j + 1, s.emoji, s.title)).join('');
  nav.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b || b.disabled) return; const i = +b.dataset.i; playFrom(i < 0 ? 0 : i, i < 0); });
}
function setBtn(id, on, onTxt, offTxt) { const b = $(id); b.textContent = on ? onTxt : offTxt; b.setAttribute('aria-pressed', on); b.classList.toggle('armed', !on); }
$('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); setBtn('soundBtn', S.sound, 'Sound on', 'Sound off'); if (!S.sound) hush(); if (audio()) master.gain.setTargetAtTime(S.sound ? 0.8 : 0, now(), 0.05); });
$('voiceBtn').addEventListener('click', () => { S.voice = !S.voice; save(); setBtn('voiceBtn', S.voice, 'Voice on', 'Voice off'); if (!S.voice) hush(); });
$('fullBtn').addEventListener('click', () => { const el = document.documentElement; if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); });
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('fullBtn').textContent = document.fullscreenElement || document.webkitFullscreenElement ? 'Exit full screen' : 'Full screen'; W = 0; }));
startBtn.addEventListener('click', () => playFrom(0, true));
setBtn('soundBtn', S.sound, 'Sound on', 'Sound off'); setBtn('voiceBtn', S.voice, 'Voice on', 'Voice off');

/* ---- boot ---- */
function layout() {
  W = stageWrap.clientWidth || 800; H = clamp(Math.round(W * 9 / 16), 240, Math.max(260, Math.round(window.innerHeight * (document.fullscreenElement ? 0.86 : 0.74))));
  renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix();
}
function update(dt) {
  real += dt; time += dt;
  stepWaits(); stepTickers(dt); stepTurn();
  for (const a of actors) stepActor(a, dt);
  stepBits(dt); stepPuffs(dt); stepBubbles(dt); stepFloats(dt);
  if (world.blades) world.blades.rotation.z += dt * 0.9;
  for (const c of world.clouds) { c.position.x += dt * 0.7; if (c.position.x > 160) c.position.x = -160; }
  stepCamera(dt);
}
let last = performance.now();
const SPEED = +new URLSearchParams(location.search).get('speed') || 1; // ?speed=4 for quick checks
function frame(t) { requestAnimationFrame(frame); const dt = Math.min(0.05, (t - last) / 1000) * SPEED; last = t; if (!W) layout(); update(dt); renderer.render(scene, camera); }
function boot() {
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.useLegacyLights = true; glHost.appendChild(renderer.domElement);
  } catch (e) { glHost.innerHTML = '<p class="gl-fail">This browser can\'t draw the 3D farm. Try Safari or Chrome on a computer or iPad.</p>'; startOv.hidden = true; return; }
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd9ff); scene.fog = new THREE.Fog(0xbfe7ff, 90, 230);
  camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 500);
  hemi = new THREE.HemisphereLight(0xcfe9ff, 0x6a9a4a, 0.75); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff4dc, 1.0); sun.position.set(24, 44, 30); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = sun.shadow.camera.bottom = -40; sun.shadow.camera.right = sun.shadow.camera.top = 40; sun.shadow.camera.near = 1; sun.shadow.camera.far = 160; sun.shadow.bias = -0.0005; scene.add(sun); scene.add(sun.target);
  buildTextures(); buildFarm(); renderChips();
  renderer.domElement.addEventListener('pointerdown', onTap);
  window.addEventListener('resize', () => { W = 0; });
  requestAnimationFrame(frame);
  let ready = false;
  const go = () => { if (ready) return; ready = true; buildCast(); world.foods = []; setupMorning(); setSky(0); cut(); startBtn.disabled = false; startBtn.textContent = '▶ Start the day'; document.querySelectorAll('.chip').forEach(c => (c.disabled = false)); };
  loadModels().then(go); setTimeout(go, 12000);
}
boot();
// for automated checks: where to tap next, and how many recordings are ready
window.__farm = { next: () => { if (!turn) return null; const t = turn.targets.find(t => t.spot || t.root.visible), s = t && onScreen(t), r = renderer.domElement.getBoundingClientRect(); return s && [r.left + s[0], r.top + s[1]]; }, sounds: () => Object.fromEntries(Object.entries(samples).map(([k, v]) => [k, v.length])), lines: () => Object.keys(voBufs).length };
</script>
